<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PRISM</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1a14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<style>
:root{--mut:#ffffffbf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c1a14;color:#fff;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;overflow:hidden;text-shadow:0 1px 6px #0006}
.bg{position:fixed;inset:0;z-index:0;background:center/cover var(--bgimg);animation:bz 30s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(#08121c33,#08121c26 55%,#08121c90)}
@keyframes bz{to{transform:scale(1.08) translate(-1.5%,1%)}}
.glass{background:linear-gradient(135deg,#ffffff3f,#ffffff12);backdrop-filter:blur(18px) saturate(190%);-webkit-backdrop-filter:blur(18px) saturate(190%);border:1px solid #ffffff59;box-shadow:inset 0 1px 0 #ffffffb3,inset 0 -1px 0 #ffffff22,0 14px 34px #0005;border-radius:28px}
#v{position:relative;z-index:1;height:100%;overflow-y:auto;padding:14px 14px 118px;scrollbar-width:none}
#v.rl{padding:0;scroll-snap-type:y mandatory}#v.ct{display:flex;flex-direction:column;padding-bottom:104px}
.reel{position:relative;height:100%;scroll-snap-align:start;overflow:hidden}
.pz{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 9s ease-in-out infinite alternate}.pz.gr{background-size:300% 300%;animation:gs 7s ease infinite}
@keyframes kb{to{transform:scale(1.16) translate(-2%,2%)}}@keyframes gs{50%{background-position:100% 100%}}
.reel .cap{position:absolute;left:14px;right:84px;bottom:108px;padding:14px 16px}
.reel .act{position:absolute;right:12px;bottom:108px;display:flex;flex-direction:column;gap:14px}
.card{margin-bottom:18px;padding:12px}.card header{display:flex;align-items:center;gap:10px;padding:2px 4px 10px}.card header small{margin-left:auto;color:var(--mut)}
.poster{position:relative;aspect-ratio:4/5;border-radius:22px;background-size:cover;background-position:center;overflow:hidden;box-shadow:inset 0 0 0 1px #fff5}.poster.gr{background-size:300% 300%;animation:gs 9s ease infinite}
.bar{display:flex;gap:10px;padding:12px 2px 6px}
.orb{position:relative;border:1px solid #ffffff66;color:#fff;font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;background:linear-gradient(160deg,#ffffff40,#ffffff14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 2px 3px #ffffffa0,inset 0 -3px 6px #ffffff1a,0 6px 16px #0004;cursor:pointer;display:flex;gap:6px;align-items:center;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .3s}
.orb::after{content:"";position:absolute;left:14%;right:14%;top:3px;height:36%;border-radius:999px;background:linear-gradient(#fff8,#fff0);pointer-events:none}
.orb:active{transform:scale(.9)}.orb.on{background:linear-gradient(160deg,#ffb0e0cc,#ff5fb0aa);box-shadow:inset 0 2px 3px #fffa,0 0 22px #ff5fb8aa;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.reel .orb{flex-direction:column;border-radius:26px;padding:10px 12px;font-size:12px}
@keyframes pop{40%{transform:scale(1.3) rotate(-8deg)}}
.pc{margin:2px 4px 4px;line-height:1.35}.pc b{margin-right:6px}
.av{border-radius:50%;background-size:cover;background-position:center;flex:none;box-shadow:0 0 0 2px #ffffff80,0 0 0 4px #ffffff22;cursor:pointer}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 16px;scrollbar-width:none}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut);cursor:pointer;flex:none;position:relative}
.ring{padding:3px;border-radius:50%;background:conic-gradient(from 0deg,#ff6fc8,#52e6ff,#ffe36b,#ff6fc8);animation:rot 6s linear infinite;box-shadow:0 0 18px #52e6ff77}
.ring.q{background:#ffffff55;animation:none;box-shadow:none}
@keyframes rot{to{filter:hue-rotate(360deg)}}
.ring .av{box-shadow:0 0 0 3px #1b2a3acc}
.plus{position:absolute;right:-2px;top:44px;width:22px;height:22px;border-radius:50%;background:#52e6ff;color:#08121c;font-weight:900;display:grid;place-items:center;border:2px solid #fff;text-shadow:none}
h1{margin:0;font-size:30px;letter-spacing:3px;background:linear-gradient(90deg,#ffd0f0,#aef4ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
#nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:7px;border-radius:999px}
#nav button{width:49px;height:46px;border:0;border-radius:999px;background:none;color:#fff;font-size:19px;cursor:pointer;display:grid;place-items:center;opacity:.75;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s}
#nav button.on{opacity:1;background:linear-gradient(160deg,#ffffff50,#ffffff18);box-shadow:inset 0 1px 2px #fffc,0 0 16px #8fe8ff77;transform:translateY(-3px) scale(1.08)}
#nav .mk{background:linear-gradient(135deg,#ff7ad0,#7a8cff);opacity:1}
.gbtn{border:1px solid #ffffff88;color:#fff;font:inherit;font-weight:800;padding:13px 22px;border-radius:999px;background:linear-gradient(135deg,#ff7ad0cc,#7a8cffcc);box-shadow:inset 0 2px 3px #fffa,0 8px 22px #7a8cff77;cursor:pointer;width:100%;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.gbtn:active{transform:scale(.95)}.gbtn.sm{width:auto;padding:9px 18px;font-size:14px}.gbtn.gl{background:linear-gradient(160deg,#ffffff40,#ffffff14);box-shadow:inset 0 1px 2px #fffa,0 6px 16px #0004}
input,textarea{width:100%;font:inherit;color:#fff;padding:13px 16px;border-radius:18px;border:1px solid #ffffff59;background:#ffffff1f;outline:none;margin-bottom:10px;resize:none;backdrop-filter:blur(10px);transition:box-shadow .25s,background .25s}
input:focus,textarea:focus{background:#ffffff33;box-shadow:0 0 0 3px #8fe8ff66}input::placeholder,textarea::placeholder{color:#ffffffa6}
.auth{max-width:380px;margin:6vh auto 0;padding:26px;text-align:center}
.seg{display:flex;padding:5px;gap:4px;border-radius:999px;margin-bottom:14px}.seg button{flex:1;border:0;background:none;color:#fff;font:inherit;font-weight:700;padding:10px;border-radius:999px;cursor:pointer;opacity:.75;transition:background .25s}
.seg button.on{opacity:1;background:linear-gradient(160deg,#ffffff50,#ffffff18);box-shadow:inset 0 1px 2px #fffc}
.sw{display:flex;gap:10px;margin:2px 0 14px}.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid #fff8;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}.sw i.on{box-shadow:0 0 0 3px #8fe8ff;transform:scale(1.15)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid div{aspect-ratio:1;border-radius:18px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px #fff5;cursor:pointer}
.stats{display:flex;justify-content:space-around;margin:16px 0;text-align:center}.stats b{display:block;font-size:22px}.stats span{color:var(--mut);font-size:13px}
#sheet{position:fixed;inset:0;z-index:9;display:none;background:#0007;align-items:flex-end;justify-content:center}#sheet.on{display:flex;animation:fade .3s}
#sheet>div{width:100%;max-width:520px;max-height:86%;overflow-y:auto;padding:20px;border-radius:32px 32px 0 0;animation:up .5s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.cm{display:flex;gap:10px;margin-bottom:12px;line-height:1.35}
#toast{position:fixed;z-index:40;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);padding:11px 20px;border-radius:999px;transition:transform .45s cubic-bezier(.34,1.56,.64,1);font-weight:700}#toast.on{transform:translate(-50%,0)}
.mut{color:var(--mut)}
.fb{font:inherit;font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid #fff9;background:linear-gradient(135deg,#7a8cffcc,#52e6ffaa);color:#fff;box-shadow:inset 0 1px 2px #fffa;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .25s}
.fb:active{transform:scale(.9)}.fb.on{background:linear-gradient(160deg,#ffffff40,#ffffff14)}
.srch{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;margin-bottom:16px;border-radius:999px}.srch input{margin:0;border:0;background:none;padding:10px 6px;backdrop-filter:none}
.lens{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;background:conic-gradient(from 200deg,#ff7ad0,#52e6ff,#ffe36b,#ff7ad0);box-shadow:inset 0 2px 4px #fffb,0 0 20px #52e6ff88;animation:rot 5s linear infinite}
.uc{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;border-radius:26px;animation:rise .5s cubic-bezier(.2,.9,.25,1) both}
.uc>div{flex:1;min-width:0}.uc .mut{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:10px}
#ml{flex:1;overflow-y:auto;padding:4px 2px;scrollbar-width:none}
.bub{width:fit-content;max-width:80%;padding:10px 14px;margin:5px 0;border-radius:20px 20px 20px 6px;background:linear-gradient(135deg,#ffffff3a,#ffffff14);border:1px solid #fff5;line-height:1.35;animation:rise .35s cubic-bezier(.2,.9,.25,1) both;word-break:break-word}
.bub.me{margin-left:auto;border-radius:20px 20px 6px 20px;background:linear-gradient(135deg,#ff7ad0aa,#7a8cffaa)}.bub small{display:block;font-size:10px;opacity:.7;margin-top:2px}
.cin{display:flex;gap:8px;padding:8px;margin-top:10px;border-radius:999px;align-items:center}.cin input{margin:0;border-radius:999px}
#sv{position:fixed;inset:0;z-index:30;display:none;background:#000}#sv.on{display:block;animation:fade .25s}
.svb{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 10s ease-out forwards}
.svt{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:4px;z-index:3}
.svt b{flex:1;height:4px;border-radius:4px;background:#ffffff55;overflow:hidden;box-shadow:inset 0 0 0 1px #fff3}.svt b i{display:block;height:100%;width:0;background:#fff}.svt b.d i{width:100%}.svt b.a i{animation:fill 5s linear forwards}#sv.ps .a i{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.svh{position:absolute;left:10px;right:10px;top:calc(24px + env(safe-area-inset-top,0px));z-index:3;display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:999px}
.svh button{margin-left:auto;border:0;background:#ffffff30;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.svc{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);text-align:center;font-size:28px;font-weight:800;line-height:1.25;z-index:2;animation:rise .6s .1s both}
.svz{position:absolute;inset:90px 0 90px;z-index:2;display:flex}.svz i{flex:1}.svz i:first-child{flex:.4}
.svr{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:8px;padding:8px;border-radius:999px;align-items:center}.svr input{margin:0;border-radius:999px}
.em{position:absolute;pointer-events:none;z-index:4;line-height:1;transform:translate(-50%,-50%);animation:emo 1.1s cubic-bezier(.2,.8,.25,1) forwards;filter:drop-shadow(0 6px 10px #0006)}
@keyframes emo{0%{transform:translate(-50%,-50%) scale(0) rotate(-18deg);opacity:0}25%{transform:translate(-50%,-62%) scale(1.3) rotate(6deg);opacity:1}60%{transform:translate(-50%,-110%) scale(1) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx,0px)),calc(-190% + var(--dy,0px))) scale(.8);opacity:0}}
#v.fresh:not(.rl)>*{animation:rise .55s cubic-bezier(.2,.9,.25,1) both}#v.fresh>*:nth-child(2){animation-delay:.06s}#v.fresh>*:nth-child(3){animation-delay:.12s}#v.fresh>*:nth-child(4){animation-delay:.18s}
#v.rl.fresh .cap,#v.rl.fresh .act{animation:rise .6s .1s both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
.av.sel{box-shadow:0 0 0 3px #8fe8ff,0 0 16px #8fe8ff88}
.avg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0 14px}.avg .av{width:100%;height:auto;aspect-ratio:1}
.wp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.wp div{aspect-ratio:9/14;border-radius:14px;background-size:cover;background-position:center;cursor:pointer;box-shadow:inset 0 0 0 1px #fff5}.wp div.sel{box-shadow:0 0 0 3px #8fe8ff}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1;justify-content:center}.row .fb{padding:9px 12px;font-size:14px}
.shr{display:flex;gap:10px;align-items:center;padding:6px;border-radius:14px;background:#0004;cursor:pointer;margin-bottom:6px}.shr i{width:46px;height:58px;border-radius:10px;background-size:cover;background-position:center;flex:none}

#splash{position:fixed;inset:0;z-index:9999;background:#020a22;display:grid;place-items:center;transition:opacity .6s ease}
#splash video{width:100%;height:100%;object-fit:cover}
#splash .tap{position:absolute;inset:0;display:none;place-items:end center;padding-bottom:14vh;background:#02082055;font-weight:700;letter-spacing:.14em;font-size:15px}
#splash .tap span{padding:12px 26px;border-radius:30px;border:1px solid #ffffff80;background:#ffffff22;backdrop-filter:blur(10px);animation:pp 1.4s ease-in-out infinite}
@keyframes pp{50%{transform:scale(1.07);opacity:.75}}
#splash .skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;padding:7px 15px;border-radius:20px;border:1px solid #ffffff59;background:#ffffff1f;color:#fff;font:600 13px inherit;cursor:pointer}
.gg{background:#fff!important;color:#202124!important;text-shadow:none!important;margin-top:10px}
.or{margin:12px 0 0;font-size:12px;opacity:.7}
</style></head><body>

return`<div class="glass" style="padding:22px;text-align:center"><div class="av" style="width:104px;height:104px;margin:0 auto 12px;${avs(m)}"></div><div style="font-size:22px;font-weight:800">${esc(m.name)}</div><div class="mut">@${me}</div><p style="margin:10px 0 0">${esc(m.bio||'No bio yet')}</p>${stats(me)}<div class="row"><button class="gbtn sm" onclick="editP()">Edit profile</button><button class="gbtn sm gl" onclick="setS()">⚙ Settings</button></div></div><div class="grid" style="margin-top:16px">${mine.map(gi).join('')||'<p class="mut" style="grid-column:1/4;text-align:center">No posts yet. Tap ✚ to create one.</p>'}</div>`}
function viewU(h){if(!S.users[h])return;const m=U(h),ps=posts().filter(p=>p.by==h&&p.type!='story').sort((a,b)=>b.t-a.t);openS(`<div style="text-align:center"><div class="av" style="width:90px;height:90px;margin:0 auto 10px;${avs(m)}"></div><b style="font-size:20px">${esc(m.name)}</b><div class="mut">@${h}</div><p>${esc(m.bio||'')}</p>${stats(h)}${h!=me?`<div class="row">${fbtn(h)}<button class="orb" onclick="openChat('${h}')">💬 Message</button></div>`:`<div class="row"><button class="gbtn sm" onclick="editP()">Edit profile</button></div>`}</div><div class="grid" style="margin-top:14px">${ps.map(gi).join('')}</div>`)}
const avc=i=>`<div class="av${U(me).av.a===i?' sel':''}" data-i="${i}" onclick="pickAv(${i})" style="background-image:url(${avSvg(i)})"></div>`;
function pickAv(i){window.NA={a:i};$('#pv').style.cssText='width:96px;height:96px;margin:0 auto 8px;background-image:url('+avSvg(i)+')';document.querySelectorAll('.avg .av').forEach(x=>x.classList.toggle('sel',x.dataset.i==i))}
function editP(){const m=U(me);window.NA=null;openS(`<h1 style="font-size:22px;margin-bottom:14px">Edit profile</h1><label for="f3" style="display:block;text-align:center"><div class="av" id="pv" style="width:96px;height:96px;margin:0 auto 8px;${avs(m)}"></div><span class="orb" style="display:inline-flex">Upload photo</span></label><input id="f3" type="file" accept="image/*" hidden onchange="pick(this.files[0],d=>{window.NA={img:d};$('#pv').style.cssText='width:96px;height:96px;margin:0 auto 8px;background-image:url('+d+')'},300)"><p class="mut" style="margin:16px 0 0">Or choose an avatar</p><b>Girls</b><div class="avg">${[...Array(15).keys()].map(avc).join('')}</div><b>Boys</b><div class="avg">${[...Array(15).keys()].map(i=>avc(i+15)).join('')}</div><input id="nm" value="${esc(m.name)}" placeholder="Display name"><textarea id="bi" rows="2" maxlength="120" placeholder="Bio">${esc(m.bio||'')}</textarea><button class="gbtn" onclick="saveP()">Save</button>`)}
function saveP(){const m=JSON.parse(JSON.stringify(U(me)));m.name=$('#nm').value.trim().slice(0,24)||me;m.bio=$('#bi').value.trim();if(window.NA)m.av=window.NA;window.NA=null;put('users',me,m);closeS();render(1)}
function setS(){openS(`<h1 style="font-size:22px;margin-bottom:14px">Settings</h1><button class="gbtn gl" style="margin-bottom:10px" onclick="editP()">✎ Edit profile & avatar</button><button class="gbtn gl" style="margin-bottom:10px" onclick="wpS('prism_bg')">🖼 Home screen wallpaper</button><button class="gbtn gl" style="margin-bottom:10px" onclick="wpS('prism_mbg')">💬 Message wallpaper</button><button class="gbtn gl" onclick="closeS();me=null;localStorage.removeItem('prism_me');render()">Log out</button>`)}
function wpS(k){const m=k=='prism_mbg',c=localStorage.getItem(k)||(m?'':DEF);openS(`<h1 style="font-size:22px;margin-bottom:6px">${m?'Message wallpaper':'Home screen wallpaper'}</h1><p class="mut" style="margin:0 0 14px">Saved only on this phone, so every phone can look different.</p>${c?`<div class="poster" style="aspect-ratio:16/10;margin-bottom:14px;background-image:url(${c})"></div>`:''}<div class="wp">${WPC.map((_,i)=>`<div class="${WP(i)==c?'sel':''}" style="background-image:url(${WP(i)})" onclick="setW('${k}',${i})"></div>`).join('')}</div><label for="f4" class="gbtn" style="display:block;text-align:center;margin-bottom:10px">Choose from gallery</label><input id="f4" type="file" accept="image/*" hidden onchange="pick(this.files[0],d=>setW('${k}',d),1100)"><button class="gbtn gl" onclick="setW('${k}',null)">${m?'Remove wallpaper':'Use default'}</button><button class="gbtn gl" style="margin-top:10px" onclick="setS()">‹ Back</button>`)}
function setW(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,typeof v=='number'?WP(v):v);bgSet();wpS(k);if(tab=='chat'&&CH)render(1);toast('Wallpaper updated')}catch(e){toast('Image too big for this phone')}}
function postMenu(id){const p=S.posts[id];if(!p)return;openS(`<h1 style="font-size:22px;margin-bottom:14px">Edit post</h1><textarea id="ec" rows="3" maxlength="300">${esc(p.cap||'')}</textarea><button class="gbtn" onclick="saveC('${id}')">Save caption</button><button class="gbtn gl" style="margin-top:10px;color:#ffb0b0" onclick="delP('${id}')">Delete post</button>`)}
function saveC(id){const p=JSON.parse(JSON.stringify(S.posts[id]));p.cap=$('#ec').value.trim();put('posts',id,p);closeS();render(1);toast('Updated')}
function delP(id){if(!confirm('Delete this post?'))return;delete S.posts[id];persist();if(DB)DB.doc('posts/'+id).delete().catch(()=>{});closeS();render(1);toast('Deleted')}
// chat
const thread=h=>[...((S.msgs[me+'-'+h]||{}).m||[]).map(m=>({...m,me:1})),...((S.msgs[h+'-'+me]||{}).m||[])].sort((a,b)=>a.t-b.t);
function convos(){const s=new Set(E(me).fl||[]);Object.keys(S.msgs).forEach(k=>{const[a,b]=k.split('-');if(a==me)s.add(b);if(b==me)s.add(a)});return[...s].filter(h=>S.users[h]).map(h=>({h,l:thread(h).pop()})).sort((a,b)=>((b.l||{}).t||0)-((a.l||{}).t||0))}
const bubs=h=>thread(h).map(m=>{const p=m.p&&S.posts[m.p];return`<div class="bub${m.me?' me':''}">${p?`<div class="shr" onclick="openS(card(S.posts['${p.id}']))"><i style="background-image:${p.img?'url('+p.img+')':G[p.g%6]}"></i><div><b>@${p.by}</b><div class="mut" style="font-size:12px">${p.type=='reel'?'▷ Reel':'Post'} · ${esc((p.cap||'').slice(0,40))}</div></div></div>`:''}${esc(m.x)}<small>${ago(m.t)}</small></div>`}).join('')||'<p class="mut" style="text-align:center;margin-top:30px">Say hi 👋</p>';
function chatV(){if(CH)return`<div class="ch glass"><button class="orb" style="padding:6px 12px" onclick="CH=null;F=1;render()">‹</button>${av(CH,38)}<b>${esc(U(CH).name)}</b><span class="mut">@${CH}</span></div><div id="ml" style="${mbgCss()}">${bubs(CH)}</div><div class="cin glass"><input id="mi" placeholder="Message..." onkeydown="if(event.key=='Enter')sendC()"><button class="orb" onclick="sendC()">➤</button></div>`;
const l=convos();return`<h1 style="font-size:26px;margin:2px 6px 14px">Messages</h1>${l.map((c,i)=>`<div class="uc glass" style="animation-delay:${i*50}ms" onclick="openChat('${c.h}')"><div class="ring q" style="padding:3px">${avn(c.h,50)}</div><div><b>${esc(U(c.h).name)}</b><div class="mut">${c.l?(c.l.me?'You: ':'')+esc(c.l.x):'Tap to start chatting'}</div></div><span class="mut">${c.l?ago(c.l.t):''}</span></div>`).join('')||'<div class="glass" style="padding:26px;text-align:center"><b>No chats yet</b><p class="mut">Find a friend with ✧ and tap 💬 to message them.</p></div>'}`}
function sendMsg(h,x,p){const k=me+'-'+h,d=JSON.parse(JSON.stringify(S.msgs[k]||{m:[]}));d.m.push(p?{t:ts(),x:x.slice(0,500),p}:{t:ts(),x:x.slice(0,500)});d.m=d.m.slice(-200);put('msgs',k,d)}
function sendC(){const i=$('#mi'),x=i.value.trim();if(!x)return;sendMsg(CH,x);i.value='';updM()}
function updM(){const l=$('#ml');if(!l)return;l.innerHTML=bubs(CH);l.scrollTop=1e9}
function openChat(h){closeS();tab='chat';CH=h;F=1;render()}
// stories
function openStory(h){const l=stor()[h];if(!l)return;SV={l,i:0};showSV();$('#sv').classList.add('on')}
function showSV(){clearTimeout(SV.t);const p=SV.l[SV.i],i=SV.i;$('#sv').classList.remove('ps');$('#sv').innerHTML=`<div class="svb" style="background-image:${p.img?'url('+p.img+')':G[p.g%6]}"></div><div class="svt">${SV.l.map((_,j)=>`<b class="${j<i?'d':j==i?'a':''}"><i></i></b>`).join('')}</div><div class="svh glass">${av(p.by,34)}<b>${esc(U(p.by).name)}</b><span class="mut">${ago(p.t)}</span><button onclick="closeSV()">✕</button></div>${p.cap?`<div class="svc">${esc(p.cap)}</div>`:''}<div class="svz"><i onclick="svGo(-1)"></i><i onclick="svGo(1)"></i></div>${p.by!=me?`<div class="svr glass"><input id="svi" placeholder="Send message..." onfocus="clearTimeout(SV.t);$('#sv').classList.add('ps')" onblur="svGo(0)"><button class="orb" onclick="svSend()">➤</button></div>`:''}`;SV.t=setTimeout(()=>svGo(1),5000)}
function svGo(d){if(!SV)return;if(d==0){const i=$('#svi');if(i&&i.value)return;SV.t=setTimeout(()=>svGo(1),5000);$('#sv').classList.remove('ps');return}SV.i+=d;if(SV.i<0)SV.i=0;if(SV.i>=SV.l.length)return closeSV();showSV()}
function svSend(){const i=$('#svi'),x=i.value.trim();if(!x)return;sendMsg(SV.l[0].by,'Replied to your story: '+x);i.value='';toast('Sent');svGo(0)}
function closeSV(){if(SV)clearTimeout(SV.t);SV=null;$('#sv').classList.remove('on')}
// actions
function openS(h){$('#sb').innerHTML=h;$('#sheet').classList.add('on')}function closeS(){$('#sheet').classList.remove('on')}
function spark(id){const on=!sparks(id).includes(me);mut(e=>{on?e.sp.push(id):e.sp.splice(e.sp.indexOf(id),1)});document.querySelectorAll(`[data-s="${id}"]`).forEach(b=>{b.classList.toggle('on',on);b.querySelector('span:last-child').textContent=fmt(lk(id))});document.querySelectorAll(`[data-st="${id}"]`).forEach(x=>x.textContent=st(id))}
function tap(e,id){if(e.target.closest('button'))return;const n=ts();if(n-lt<320&&lid==id){burst(e);if(!sparks(id).includes(me))spark(id);lt=0}else{lt=n;lid=id}}
function burst(e){const el=e.currentTarget,r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(let i=0;i<5;i++){const m=document.createElement('div');m.className='em';m.textContent='😍';m.style.cssText=`left:${x}px;top:${y}px;font-size:${i?30:96}px;animation-delay:${i?i*70:0}ms;--dx:${i?(i-2.5)*50:0}px;--dy:${i?-40*i:0}px`;el.appendChild(m);setTimeout(()=>m.remove(),1500)}}
function echo(id){openS(`<h1 style="font-size:22px;margin-bottom:14px">Comments</h1>${cmts(id).map(c=>`<div class="cm">${av(c.by,34)}<div><b>@${c.by}</b> <span class="mut">${ago(c.t)}</span><div>${esc(c.x)}</div></div></div>`).join('')||'<p class="mut">No comments yet.</p>'}<div style="display:flex;gap:8px;margin-top:10px"><input id="ci" placeholder="Add a comment..." style="margin:0"><button class="gbtn sm" onclick="sendE('${id}')">Send</button></div>`)}
function sendE(id){const x=$('#ci').value.trim();if(!x)return;mut(e=>e.cm.push({p:id,t:ts(),x:x.slice(0,200)}));echo(id);render(1)}
function beam(id){const p=S.posts[id];if(!p)return;const fr=[...new Set([...(E(me).fl||[]),...convos().map(c=>c.h)])].filter(h=>S.users[h]&&h!=me);openS(`<h1 style="font-size:22px;margin-bottom:6px">Share ${p.type=='reel'?'reel':'post'}</h1><p class="mut" style="margin:0 0 12px">Send to a friend's message box</p>${fr.map(h=>`<div class="uc glass"><div class="ring q" style="padding:3px">${avn(h,46)}</div><div><b>${esc(U(h).name)}</b><div class="mut">@${h}</div></div><button class="fb" onclick="shareTo('${h}','${id}',this)">Send</button></div>`).join('')||'<p class="mut">Follow someone first, then you can send them posts.</p>'}<button class="gbtn gl" style="margin-top:6px" onclick="ext('${id}')">↗ Share outside PRISM</button>`)}
function shareTo(h,id,b){sendMsg(h,'Shared a '+(S.posts[id].type=='reel'?'reel':'post'),id);b.textContent='Sent ✓';b.classList.add('on');b.disabled=true}
async function ext(id){const p=S.posts[id],t='@'+p.by+' on PRISM: '+(p.cap||'');try{if(navigator.share)await navigator.share({title:'PRISM',text:t});else{await navigator.clipboard.writeText(t);toast('Copied to share anywhere')}}catch(e){}}

function go(t){tab=t;CH=null;F=1;render()}
function render(keep){const v=$('#v'),n=$('#nav'),y=v.scrollTop;if(!me){n.style.display='none';v.className='';v.innerHTML=authV();return}
n.style.display='flex';v.className=(tab=='reels'?'rl':'')+(tab=='chat'&&CH?' ct':'')+(F?' fresh':'');F=0;v.innerHTML={home:homeV,find:findV,make:makeV,reels:reelV,chat:chatV,me:profV}[tab]();
n.innerHTML=[['home','◈'],['find','✧'],['make','✚'],['reels','▷'],['chat','💬'],['me','']].map(([k,i])=>`<button class="${tab==k?'on':''}${k=='make'?' mk':''}" onclick="go('${k}')">${k=='me'?av(me,32):i}</button>`).join('');
if(tab=='find')runQ();if(tab=='reels'||tab=='home')watch();if(tab=='chat'&&CH)updM();else if(keep)v.scrollTop=y}
let IO;function watch(){if(IO)IO.disconnect();IO=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){const id=x.target.dataset.id,p=S.posts[id];if(p&&p.by!=me&&!(E(me).vw||[]).includes(id)){mut(e=>e.vw.push(id));document.querySelectorAll(`[data-st="${id}"]`).forEach(n=>n.textContent=st(id))}}}),{root:$('#v'),threshold:[.5]});document.querySelectorAll('.reel,.card[data-id]').forEach(r=>IO.observe(r))}
(()=>{const sp=document.getElementById('splash');if(!sp)return;const v=sp.querySelector('video'),tp=sp.querySelector('.tap');let d=0;
const end=()=>{if(d)return;d=1;try{v.pause()}catch(e){}sp.style.opacity=0;setTimeout(()=>sp.remove(),650)};
v.onended=end;v.onerror=end;sp.querySelector('.skip').onclick=e=>{e.stopPropagation();end()};
const go2=()=>{tp.style.display='none'};
v.play().then(go2).catch(()=>{tp.style.display='grid'});
sp.onclick=()=>{if(d||!v.paused)return;v.muted=false;v.play().then(go2).catch(end)};
setTimeout(end,15000)})();
seed();render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('PRISM offline setup:',e)));}</script></body></html>
